# Sobe o PostgreSQL 16 para desenvolvimento e testes:  docker compose up -d
# Cria os bancos "sobra" (dev) e "sobra_test" (testes automatizados).
services:
  banco:
    image: postgres:16
    environment:
      POSTGRES_USER: sobra
      POSTGRES_PASSWORD: sobra
      POSTGRES_DB: sobra
    ports:
      - "5432:5432"
    volumes:
      - sobra-dados:/var/lib/postgresql/data
      - ./scripts/criar-banco-teste.sql:/docker-entrypoint-initdb.d/criar-banco-teste.sql:ro
volumes:
  sobra-dados:
