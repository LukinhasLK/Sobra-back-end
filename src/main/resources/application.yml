# =============================================================================
# Sobra back end - configuracao comum. Segredos vem de variaveis de ambiente
# (nada de senha no codigo). Perfis: dev (padrao), test e prod.
# =============================================================================
spring:
  application:
    name: sobra
  profiles:
    default: dev

  datasource:
    url: ${SOBRA_DB_URL:jdbc:postgresql://localhost:5432/sobra}
    username: ${SOBRA_DB_USUARIO:sobra}
    password: ${SOBRA_DB_SENHA:sobra}

  jpa:
    # O esquema e do Flyway (V001...). O Hibernate nunca cria nem altera tabelas.
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8084}
  # Barra respostas com stack trace do Spring (RNF-07); o TratadorErros cuida do resto.
  error:
    include-stacktrace: never
    include-message: never

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

sobra:
  fuso-horario: America/Sao_Paulo
  # Instante fixo (ISO-8601) para testes; vazio = relogio real.
  relogio-fixo:
  exigir-https: false
  url-publica: ${SOBRA_URL_PUBLICA:http://localhost:8084}
  # D-01 (opcao A): 0,96% ao mes, provisoria. A taxa usada e gravada em cada simulacao.
  taxa-simulacao: 0.009600
  limites:
    # D-02 (opcao B). O CHECK do banco aceita ate 600 so como trava de seguranca.
    prazo-simulacao-max: 120
    prazo-objetivo-max: 360
  sessao:
    # D-07 (opcao B): deslizante 30 dias, teto 90 dias desde a criacao.
    validade-dias: 30
    teto-dias: 90
  recuperacao:
    # D-08: validade de 30 minutos, uso unico.
    validade-minutos: 30
  limite-taxa:
    # RNF-06
    login-por-email: 5
    login-por-ip: 5
    login-janela-minutos: 15
    recuperacao-por-email: 3
    recuperacao-janela-minutos: 60
    publico-por-ip: 30
    publico-janela-minutos: 15
    geral-por-token: 120
    geral-janela-segundos: 60

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    # V003 (dados de exemplo) so em desenvolvimento e teste, nunca em producao.
    locations: classpath:db/migration,classpath:db/exemplo

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${SOBRA_DB_URL_TESTE:jdbc:postgresql://localhost:5432/sobra_test}
  flyway:
    locations: classpath:db/migration,classpath:db/exemplo
sobra:
  # Os casos da especificacao usam o mes de referencia 2026-09.
  relogio-fixo: 2026-09-18T15:00:00Z
  email:
    guardar-em-memoria: true
  limite-taxa:
    login-por-ip: 100000
    publico-por-ip: 100000

---
spring:
  config:
    activate:
      on-profile: prod
server:
  # Atras de um proxy/balanceador que termina o TLS (RNF-01).
  forward-headers-strategy: framework
sobra:
  exigir-https: true
