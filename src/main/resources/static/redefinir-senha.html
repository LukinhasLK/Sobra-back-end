<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Sobra · Nova senha</title>
<style>
  :root { --verde: #0d9488; --texto: #1f2937; --suave: #6b7280; --erro: #b91c1c; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--texto);
         background: #f3f4f6; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 16px; }
  main { background: #fff; border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 380px;
         box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { margin: 0 0 4px; font-size: 22px; color: var(--verde); }
  p { margin: 0 0 20px; color: var(--suave); font-size: 14px; }
  label { display: block; font-size: 14px; margin: 14px 0 6px; }
  input { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 16px; }
  button { margin-top: 20px; width: 100%; padding: 13px; border: 0; border-radius: 10px; background: var(--verde);
           color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; }
  .msg { margin-top: 16px; font-size: 14px; }
  .erro { color: var(--erro); }
  .ok { color: var(--verde); }
</style>
</head>
<body>
<main>
  <h1>Criar nova senha</h1>
  <p>Use de 8 a 64 caracteres. Depois, entre no app com a senha nova.</p>
  <form id="form" novalidate>
    <label for="senha">Nova senha</label>
    <input id="senha" type="password" autocomplete="new-password" minlength="8" maxlength="64" required>
    <label for="confirmacao">Confirme a nova senha</label>
    <input id="confirmacao" type="password" autocomplete="new-password" minlength="8" maxlength="64" required>
    <button id="botao" type="submit">Salvar nova senha</button>
    <div id="msg" class="msg" role="status"></div>
  </form>
</main>
<script>
  // O token vem no fragmento (#token=...), que o navegador não envia ao servidor.
  const token = new URLSearchParams(location.hash.slice(1)).get('token');
  history.replaceState(null, '', location.pathname); // tira o token da barra de endereço
  const form = document.getElementById('form');
  const msg = document.getElementById('msg');
  const botao = document.getElementById('botao');

  function mostrar(texto, classe) { msg.textContent = texto; msg.className = 'msg ' + classe; }

  if (!token) {
    mostrar('Link inválido. Peça um novo link no app.', 'erro');
    botao.disabled = true;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    botao.disabled = true;
    mostrar('Salvando...', '');
    try {
      const resp = await fetch('/api/v1/auth/redefinir-senha', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token: token,
          nova_senha: document.getElementById('senha').value,
          confirmacao_senha: document.getElementById('confirmacao').value
        })
      });
      if (resp.status === 204) {
        form.querySelectorAll('input').forEach(i => i.disabled = true);
        mostrar('Senha alterada. Volte ao app e entre com a nova senha.', 'ok');
        return;
      }
      const corpo = await resp.json().catch(() => null);
      const erro = corpo && corpo.erro;
      if (erro && erro.codigo === 'VALIDACAO' && erro.campos.length) {
        mostrar(erro.campos[0].mensagem, 'erro');
      } else if (erro && erro.codigo === 'TOKEN_RECUPERACAO_INVALIDO') {
        mostrar('Este link expirou ou já foi usado. Peça um novo no app.', 'erro');
        return;
      } else if (erro && erro.codigo === 'LIMITE_REQUISICOES') {
        mostrar('Muitas tentativas. Aguarde alguns minutos.', 'erro');
      } else {
        mostrar('Não foi possível salvar agora. Tente novamente.', 'erro');
      }
      botao.disabled = false;
    } catch (err) {
      mostrar('Sem conexão. Tente novamente.', 'erro');
      botao.disabled = false;
    }
  });
</script>
</body>
</html>
